<touchégg>
  <application name="All">

    <!-- windowfiler: three fingers up opens the overview, down closes it
         and switches to the highlighted window. -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>windowfiler open</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>windowfiler close</command>
        <on>begin</on>
      </action>
    </gesture>

  </application>
</touchégg>
